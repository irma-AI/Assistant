id: secret-in-vite-env
language: tsx
severity: error
message: 'Vite ships every VITE_ variable to the browser, so a secret must not carry the prefix. Fix: drop the VITE_ prefix and read it on the server.'
rule:
  any:
    - kind: property_identifier
      regex: ^VITE_\w*(SECRET|TOKEN|PASSWORD|KEY)\w*$
    - kind: string_fragment
      regex: ^VITE_\w*(SECRET|TOKEN|PASSWORD|KEY)\w*$
