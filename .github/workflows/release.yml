name: release
# Every push to main ships one image, tagged with its commit (a tag that never moves) and attested,
# deploys it, and releases only once it is serving.
on:
  push:
    branches: [main]
permissions: {}
concurrency: release
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/irma-ai/assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:$GITHUB_SHA" --build-arg APP_VERSION="$GITHUB_SHA" .
          docker push -q "$IMAGE:$GITHUB_SHA"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref refs/heads/main
  # Deploys the attested image and checks it is the one serving; on failure it pins the previous
  # image again and opens a deploy-failure issue in Linear.
  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: checks
    permissions:
      contents: read
    outputs:
      previous: ${{ steps.deploy.outputs.previous }}
    env:
      IMAGE: ghcr.io/irma-ai/assistant
      TAG: ${{ github.sha }}
      DIGEST: ${{ needs.image.outputs.digest }}
      DOKPLOY_URL: https://dokploy.petterannerwall.se
      APPLICATION_ID: QBnL1Yn7fZ0Ficd4cbI36
      APP_URL: https://redo.petterannerwall.se
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref refs/heads/main
      - name: Deploy and check /version
        id: deploy
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: .github/scripts/deploy.sh
      - name: Open a deploy-failure issue
        if: failure()
        env:
          LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.deploy.outputs.outcome }}
        run: |
          case "$OUTCOME" in
            rolled-back) what="failed its /version or home page check; the previous image was pinned again and serves" ;;
            rollback-failed) what="failed, and the previous image did not come back either: production may be down" ;;
            *) what="failed before anything was deployed (the attestation or the Dokploy API); production is unchanged" ;;
          esac
          .github/scripts/deploy-issue.sh "$what"

  # The browser seam against production, in Playwright's image like ci's e2e job.
  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BASE_URL: https://redo.petterannerwall.se
      APP_VERSION: ${{ github.sha }}
      APP_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test

  # A smoke test that didn't pass (failed, or cancelled by a lost runner or a timeout) pins the previous image again.
  rollback:
    needs: [deploy, smoke]
    if: always() && needs.deploy.result == 'success' && needs.smoke.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: checks
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/irma-ai/assistant
      TAG: ${{ github.sha }}
      DOKPLOY_URL: https://dokploy.petterannerwall.se
      APPLICATION_ID: QBnL1Yn7fZ0Ficd4cbI36
      APP_URL: https://redo.petterannerwall.se
      PREVIOUS: ${{ needs.deploy.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the previous image again
        id: rollback
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: .github/scripts/deploy.sh rollback
      - name: Open a deploy-failure issue
        if: always()
        env:
          LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.rollback.outputs.outcome }}
        run: |
          if [ "$OUTCOME" = rolled-back ]; then what="failed the smoke test in production; the previous image was pinned again and serves"
          else what="failed the smoke test in production, and the previous image did not come back: production may be down"; fi
          .github/scripts/deploy-issue.sh "$what"

  # The version comes from the commits since the last tag (feat: minor, fix or perf: patch, a breaking
  # change: major). The tag and the GitHub Release are the only record; nothing is committed.
  release:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(git-cliff --unreleased --context | jq '[.[0].commits[] | select((.group | test("Features|Fixes|Performance")) or .breaking)] | length')
          [ "$n" -gt 0 ] || { echo "no feat, fix, perf or breaking change since the last release"; exit 0; }
          version=$(git-cliff --bumped-version)
          git-cliff --unreleased --tag "$version" --strip all > notes.md
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --notes-file notes.md
          echo "released $version"
