name: intake-dispatch
# Starts the Intake routine through its API trigger when Linear has work, so a check that
# finds none costs no cloud session. Every 10 minutes off the hour, on each merge and on demand.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency: intake-dispatch
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: checks
    permissions:
      contents: read
      pull-requests: read
    env:
      LINEAR_TEAM: IRM
      MAX_PARALLEL: 3
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick an issue
        id: pick
        env:
          LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gql() { curl -sSf https://api.linear.app/graphql -H "Authorization: $LINEAR_API_TOKEN" -H 'Content-Type: application/json' -d @-; }
          # The states' names, not their type: Needs input shares In Progress's and In Review's type (started).
          linear=$(jq -n --arg k "$LINEAR_TEAM" '{query:"query($k:String!){inFlight:issues(first:50,filter:{team:{key:{eq:$k}},state:{name:{in:[\"In Progress\",\"In Review\"]}}}){nodes{identifier state{name} labels{nodes{name}} history(first:50){nodes{createdAt fromState{name} toState{name}}} comments(first:50){nodes{createdAt body}}}} ready:issues(first:100,filter:{team:{key:{eq:$k}},state:{name:{eq:\"Ready\"}}}){pageInfo{hasNextPage} nodes{identifier createdAt inverseRelations(first:50){pageInfo{hasNextPage} nodes{type issue{identifier state{type}}}}}}}",variables:{k:$k}}' | gql)
          # shortcut: the first 100 open PRs, page through them if that many are ever open at once.
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json body,commits)
          decision=$(jq -n --argjson linear "$linear" --argjson prs "$prs" --argjson max "$MAX_PARALLEL" '{linear:$linear, prs:$prs, max:$max}' \
            | jq -r -f .github/scripts/intake-pick.jq)
          echo "$decision"
          # shortcut: history and comments are read newest first, 50 deep, so an issue busier than that can miss its answer; page them if that happens.
          case $decision in
            "fire "*) echo "ids=${decision#fire }" >> "$GITHUB_OUTPUT";;
            "resume "*) echo "ids=${decision#resume }" >> "$GITHUB_OUTPUT"; echo "resume=true" >> "$GITHUB_OUTPUT";;
          esac
      - name: Fire the Intake routine
        if: steps.pick.outputs.ids != ''
        env:
          IDS: ${{ steps.pick.outputs.ids }}
          RESUME: ${{ steps.pick.outputs.resume }}
          INTAKE_FIRE_URL: ${{ vars.INTAKE_FIRE_URL }}
          INTAKE_FIRE_TOKEN: ${{ secrets.INTAKE_FIRE_TOKEN }}
          LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN }}
        run: |
          [ -n "$INTAKE_FIRE_URL" ] && [ -n "$INTAKE_FIRE_TOKEN" ] || { echo "::error::INTAKE_FIRE_URL or INTAKE_FIRE_TOKEN is missing from the checks environment"; exit 1; }
          gql() { curl -sSf https://api.linear.app/graphql -H "Authorization: $LINEAR_API_TOKEN" -H 'Content-Type: application/json' -d @-; }
          # Claimed right after each fire, so a run seconds later can't fire it again before its session claims it.
          state=$(jq -n --arg k "$LINEAR_TEAM" '{query:"query($k:String!){workflowStates(filter:{team:{key:{eq:$k}},name:{eq:\"In Progress\"}}){nodes{id}}}",variables:{k:$k}}' | gql | jq -r '.data.workflowStates.nodes[0].id // empty') || state=
          failed=0
          for id in $IDS; do
            [[ $id =~ ^IRM-[0-9]+$ ]] || { echo "::error::refusing to fire '$id', which is not an IRM issue ID"; failed=1; continue; }
            # One call, never retried: the endpoint has no idempotency key, so a retry could start a second session.
            # The answer holds the session's URL and this repository's logs are public, so only the status is kept.
            status=$(jq -n --arg t "$id" '{text:$t}' | curl -sS -o /dev/null -w '%{http_code}' -X POST "$INTAKE_FIRE_URL" \
              -H "Authorization: Bearer $INTAKE_FIRE_TOKEN" -H 'anthropic-version: 2026-10-21' \
              -H 'anthropic-beta: experimental-cc-routine-2026-04-01' -H 'Content-Type: application/json' -d @-)
            echo "fired $id: HTTP $status"
            [ "$status" = 200 ] || { echo "::error::the fire call for $id answered HTTP $status"; failed=1; continue; }
            # The mark that stops the next run firing the same answer again: moving the issue changes nothing when it is In Progress already.
            [ "$RESUME" = true ] && { jq -n --arg id "$id" '{query:"mutation($id:String!){commentCreate(input:{issueId:$id,body:\"Resumed by intake dispatch after the answer.\"}){success}}",variables:{id:$id}}' | gql | jq -e '.data.commentCreate.success' >/dev/null \
              || echo "::warning::could not mark $id as resumed; the next run may fire it again"; continue; }
            [ -n "$state" ] && jq -n --arg id "$id" --arg s "$state" '{query:"mutation($id:String!,$s:String!){issueUpdate(id:$id,input:{stateId:$s}){success}}",variables:{id:$id,s:$s}}' | gql | jq -e '.data.issueUpdate.success' >/dev/null \
              || echo "::warning::could not move $id to In Progress; its session claims it itself"
          done
          exit $failed
