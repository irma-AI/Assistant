name: intake-dispatch
# Starts the Intake routine through its API trigger when Linear has work, so a check that
# finds none costs no cloud session. A Dokploy schedule runs it every 2 minutes (GitHub's own
# schedule drops most runs); it also runs on demand. No push trigger: a merge and a tick
# close together fired one issue twice (IRM-191).
on:
  workflow_dispatch:
permissions: {}
concurrency: intake-dispatch
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: checks
    permissions:
      contents: read
    env:
      LINEAR_TEAM: IRM
      MAX_PARALLEL: 3
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick an issue
        id: pick
        env:
          LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN }}
        run: |
          gql() { curl -sSf https://api.linear.app/graphql -H "Authorization: $LINEAR_API_TOKEN" -H 'Content-Type: application/json' -d @-; }
          # The states' names, not their type: Needs input shares In Progress's and In Review's type (started).
          linear=$(jq -n --arg k "$LINEAR_TEAM" '{query:"query($k:String!){inFlight:issues(first:50,filter:{team:{key:{eq:$k}},state:{name:{in:[\"In Progress\",\"In Review\"]}}}){nodes{identifier state{name} labels{nodes{name}}}} ready:issues(first:100,filter:{team:{key:{eq:$k}},state:{name:{eq:\"Ready\"}}}){pageInfo{hasNextPage} nodes{identifier priority createdAt inverseRelations(first:50){pageInfo{hasNextPage} nodes{type issue{identifier state{type}}}}}}}",variables:{k:$k}}' | gql)
          decision=$(jq -n --argjson linear "$linear" --argjson max "$MAX_PARALLEL" '{linear:$linear, max:$max}' | jq -r -f .github/scripts/intake-pick.jq)
          echo "$decision"
          case $decision in "fire "*) echo "ids=${decision#fire }" >> "$GITHUB_OUTPUT";; esac
      - name: Fire the Intake routine
        if: steps.pick.outputs.ids != ''
        env:
          IDS: ${{ steps.pick.outputs.ids }}
          INTAKE_FIRE_URL: ${{ vars.INTAKE_FIRE_URL }}
          INTAKE_FIRE_TOKEN: ${{ secrets.INTAKE_FIRE_TOKEN }}
        run: |
          [ -n "$INTAKE_FIRE_URL" ] && [ -n "$INTAKE_FIRE_TOKEN" ] || { echo "::error::INTAKE_FIRE_URL or INTAKE_FIRE_TOKEN is missing from the checks environment"; exit 1; }
          # No claim here: a fire whose session dies leaves the issue in Ready, and the next run retries it.
          failed=0
          for id in $IDS; do
            [[ $id =~ ^IRM-[0-9]+$ ]] || { echo "::error::refusing to fire '$id', which is not an IRM issue ID"; failed=1; continue; }
            # One call, never retried: the endpoint has no idempotency key, so a retry could start a second session.
            # The answer holds the session's URL and this repository's logs are public, so only the status is kept.
            status=$(jq -n --arg t "$id" '{text:$t}' | curl -sS -o /dev/null -w '%{http_code}' -X POST "$INTAKE_FIRE_URL" \
              -H "Authorization: Bearer $INTAKE_FIRE_TOKEN" -H 'anthropic-version: 2026-10-21' \
              -H 'anthropic-beta: experimental-cc-routine-2026-04-01' -H 'Content-Type: application/json' -d @-)
            echo "fired $id: HTTP $status"
            [ "$status" = 200 ] || { echo "::error::the fire call for $id answered HTTP $status"; failed=1; }
          done
          exit $failed
