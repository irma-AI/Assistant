name: ci
# Parallel jobs, then one job named ci, the required check, that passes only if all of them did.
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans every commit, the PR's included
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: pnpm install --frozen-lockfile
      - run: make check-repo check-app
      - run: pnpm audit --json | .github/scripts/audit-gate.sh # needs the advisory database, so CI only

  # Playwright's image carries WebKit and its system libraries, so nothing comes from apt.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: node pnpm
      - run: command -v openssl || (apt-get update && apt-get install -y --no-install-recommends openssl) # the local e2e server needs a throwaway certificate
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e # the image has no make; make e2e runs the same script

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make image-check VERSION=${{ github.sha }}
      # Critical and high findings that have a fix fail the job; exceptions live in .trivyignore.yaml.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: assistant:${{ github.sha }}
          version: v0.69.3
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml

  # Compile-only: debug and simulator builds, no signing or upload.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/cap-sync.sh
      - run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV" # Capacitor 8 needs Java 21; the runner image preinstalls it
      - run: ./gradlew assembleDebug
        working-directory: android

  ios:
    runs-on: macos-26 # Xcode 26, which Apple requires for uploads
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/cap-sync.sh
      - run: xcodebuild -version
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build

  ci:
    name: ci
    needs: [checks, e2e, image, android, ios]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success")' <<<"$RESULTS" > /dev/null || { echo "::error::A ci job failed or was skipped."; exit 1; }
